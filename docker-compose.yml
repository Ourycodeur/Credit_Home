services:

  db:
    image: postgres:16

    environment:
      POSTGRES_DB: deploy_project
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: .

    ports:
      - "8000:8000"

    depends_on:
      - db

    environment:
      DATABASE_URL: postgresql://postgres:root@db:5432/deploy_project

volumes:
  postgres_data: